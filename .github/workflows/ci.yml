name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,ml]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        # Failed tests are also emitted as annotations: the raw log needs a login to read,
        # annotations do not, so a red run can be diagnosed from the API/UI summary.
        run: |
          set -o pipefail
          python -m pytest --cov=cryptorisk --cov-report=term-missing -ra 2>&1 | tee pytest.log || status=$?
          grep -E "^(FAILED|ERROR) " pytest.log | head -8 | while IFS= read -r line; do echo "::error title=pytest::${line:0:400}"; done
          tail -n 25 pytest.log | grep -E "passed|failed|error" | head -2 | while IFS= read -r line; do echo "::notice title=pytest summary::$line"; done
          # a crash or timeout leaves no FAILED line: show where the log stopped
          tail -n 4 pytest.log | while IFS= read -r line; do echo "::notice title=pytest tail::${line:0:300}"; done
          exit ${status:-0}
      - name: Import smoke test (api)
        run: python -c "import cryptorisk.api.app"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
