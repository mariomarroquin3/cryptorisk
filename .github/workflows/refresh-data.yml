name: Refresh data

on:
  schedule:
    - cron: "20 0 * * *"   # shortly after 00:00 UTC, once the previous day is complete
  workflow_dispatch:

permissions:
  contents: write

# Never two refreshes at once (a manual run overlapping the schedule would race on the same files).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[api,ml]"
      - name: Roll data forward and push
        run: |
          git config user.name "cryptorisk-bot"
          git config user.email "cryptorisk-bot@users.noreply.github.com"
          FILES="data/results/price_history.parquet data/results/backtests_live.parquet"
          for attempt in 1 2 3; do
            # rolls price_history forward, then the live walk-forward (LSTM-Vol included)
            python -m cryptorisk.study.extend_backtests
            git add $FILES
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "data: roll price history and live walk-forward forward"
            if git push; then exit 0; fi
            # Someone pushed in between. The files are regenerable, so start again from the new
            # head instead of trying to merge binary parquet files.
            echo "push rejected (attempt $attempt); resetting to origin/main and retrying"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "could not push after 3 attempts" >&2
          exit 1
