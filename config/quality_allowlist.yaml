# Known, explained data-quality flags. `run_ingest` suppresses matching rows so
# the "unexplained" report is what must be empty. Each rule needs a reason.

- kind: source_divergence
  before: "2019-07-01"
  reason: >
    USDT/USD basis. Binance quotes BTCUSDT / ETHUSDT (Tether). USDT traded at a
    discount to USD through 2018 (down to ~0.92 in Oct 2018) and re-depegged
    around the NY Attorney General's action against Bitfinex/Tether (filed
    2019-04-25). The canonical return series uses the CoinMetrics PriceUSD
    reference (true USD), so the study is unaffected; the flag confirms that
    choice. Divergence is negligible from mid-2019.

- kind: few_intraday_bars
  before: "2020-06-01"
  reason: >
    Binance exchange maintenance / unscheduled outage days (2018-2020), incl.
    the multi-day February 2018 upgrade. The daily return series (CoinMetrics
    reference) does not depend on Binance uptime. Realized measures on these
    days are computed on partial 5-minute bars and stay flagged for
    down-weighting in the realized-model evaluation.

- kind: extreme_return
  dates: ["2020-03-12"]
  reason: >
    COVID "Black Thursday" crash. Genuine intraday move of about -47% (BTC) and
    -57% (ETH), confirmed across venues. A true tail event, not a bad print.

- kind: extreme_return
  asset: BNB
  dates: ["2018-01-05", "2021-02-19"]
  reason: >
    Genuine BNB parabolic moves, confirmed on both Binance and the CoinMetrics
    reference. 2018-01-05: the January-2018 alt blow-off, BNB ~$9 -> ~$15
    close-to-close. 2021-02-19: the BSC-hype run, BNB ~$130 -> ~$280 in a day.
    Both are real tail events for this asset, not bad prints.

- kind: extreme_return
  asset: SOL
  dates: ["2021-05-19", "2022-11-09"]
  reason: >
    Genuine SOL crashes. 2021-05-19: the market-wide de-leveraging (China
    mining-ban headlines), SOL close ~$56 -> ~$35. 2022-11-09: the FTX/Alameda
    collapse, to which SOL had the largest token exposure. Confirmed on Binance
    and the Coinbase SOL-USD reference; true tail events.

- kind: source_divergence
  asset: BNB
  dates: ["2020-09-14", "2020-09-18"]
  reason: >
    Two isolated ~2.2-2.5% gaps between the Binance BNBUSDT close and the
    CoinMetrics PriceUSD snapshot on low-volatility days (asset moved ~1% and
    ~0.4%). Both sources agree on the price level (~$31 and ~$27.6); the gap is
    a snapshot-timing artefact between the exchange UTC close and the reference
    rate's snapshot, in thin early BNB reference coverage. The canonical series
    uses the CoinMetrics reference, so the study is unaffected.
