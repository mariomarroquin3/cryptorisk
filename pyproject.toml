[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptorisk"
version = "0.1.0"
description = "Comparative study of volatility / tail-risk models for crypto assets (VaR, ES)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Pinned exact versions. Bump deliberately, in its own commit, with CI green.
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "arch==8.0.0",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.0",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "joblib==1.6.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cryptorisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["cryptorisk"]
